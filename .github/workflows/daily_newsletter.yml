name: Daily Newsletter Pipeline

on:
  schedule:
    # Primary: 5:17 AM UTC (7:17 AM CEST) - off-peak minute avoids GitHub top-of-hour queue congestion
    - cron: '17 5 * * *'
    # Fallback: 7:17 AM UTC (9:17 AM CEST) - secondary backup window if GitHub runner queue delays primary
    - cron: '17 7 * * *'

  workflow_dispatch:

  repository_dispatch:
    types: [trigger-daily-newsletter]




jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Give workflow permission to push commits
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Create subscribers file from secret
        run: |
          echo '${{ secrets.SUBSCRIBERS_JSON }}' > subscribers.json
          echo "✅ Loaded subscribers from GitHub Secret"
      
      - name: Install uv (Fast, Bulletproof Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          python -m playwright install --with-deps chromium
      
      - name: Create temp directory
        run: mkdir -p .tmp
      
      - name: Run Phase 1: Core Email Generation & Dispatch
        run: python3 execution/run_daily_pipeline.py --phase 1
        env:
          PYTHONPATH: .
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INTERNAL_GOD_KEY: ${{ secrets.INTERNAL_GOD_KEY }}
          SITE_URL: https://brief.delights.pro

      - name: Run Phase 2: Growth Engine & Distribution (Non-blocking)
        if: always()
        run: python3 execution/run_daily_pipeline.py --phase 2
        env:
          PYTHONPATH: .
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_SESSION_COOKIE: ${{ secrets.REDDIT_SESSION_COOKIE }}

          INTERNAL_GOD_KEY: ${{ secrets.INTERNAL_GOD_KEY }}
          SITE_URL: https://brief.delights.pro
      
      - name: Move newsletters and previews to public folder
        run: |
          mkdir -p landing/public/newsletters landing/public/previews landing/public/data
          if ls .tmp/newsletter_*.html 1> /dev/null 2>&1; then
            cp .tmp/newsletter_*.html landing/public/newsletters/
            echo "✅ Moved newsletters to public folder"
          fi
          if ls landing/public/previews/*.html 1> /dev/null 2>&1; then
            echo "✅ Previews ready in public folder"
          fi
      
      - name: Commit and push newsletters & previews
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add landing/public/newsletters/ landing/public/previews/ landing/public/data/
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "📰 Auto-generated newsletters & previews $(date +%Y-%m-%d)"
            git stash || true
            git pull --rebase origin main
            git stash pop || true
            git push origin main
          fi
      
      - name: Commit weekly insights data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/insights/ 2>/dev/null || true
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "📊 Weekly insights data $(date +%Y-%m-%d)"
            git stash || true
            git pull --rebase origin main
            git stash pop || true
            git push origin main
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-output-${{ github.run_number }}
          path: |
            .tmp/*.json
            .tmp/*.html
            .tmp/*.txt
          retention-days: 7

